name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # hatchling is fetched by build into an isolated environment, so no project dependency is installed here.
      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build the sdist and the wheel
        run: python -m build

      # --strict rejects a README that PyPI would refuse to render at upload time.
      - name: Check the distributions
        run: twine check --strict dist/*

      # PyPI refuses a version it already holds, and the refusal arrives after the build.
      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          python - <<'EOF'
          import glob, os, pathlib, sys
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          built = pathlib.Path(glob.glob("dist/*.tar.gz")[0]).name
          version = built.removeprefix("logit_classifier-").removesuffix(".tar.gz")
          if tag != version:
              sys.exit(f"release tag {tag} does not match package version {version}")
          EOF

      - name: Upload the distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    # A manual dispatch skips the tag check, and PyPI never re-releases a version number.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/logit-classifier
    # Trusted publishing mints a short lived token from this OIDC identity, so no API token is stored.
    permissions:
      id-token: write
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
